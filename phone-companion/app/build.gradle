plugins { id 'com.android.application' }

android {
    namespace 'com.ultron.phone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ultron.phone'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

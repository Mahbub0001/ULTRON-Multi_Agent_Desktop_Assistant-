syntax = "proto3";

package hcs.adapters.v1;


// ============================================
// Common Types
// ============================================

message Empty {}

message HealthCheckResponse {
    enum ServingStatus {
        SERVING_STATUS_UNSPECIFIED = 0;
        SERVING_STATUS_SERVING = 1;
        SERVING_STATUS_NOT_SERVING = 2;
        SERVING_STATUS_STARTING = 3;
        SERVING_STATUS_STOPPING = 4;
    }
    ServingStatus status = 1;
    string version = 2;
    uint64 uptime_seconds = 3;
    map<string, ComponentHealth> components = 4;
}

message ComponentHealth {
    enum ComponentStatus {
        COMPONENT_STATUS_UNSPECIFIED = 0;
        COMPONENT_STATUS_HEALTHY = 1;
        COMPONENT_STATUS_DEGRADED = 2;
        COMPONENT_STATUS_UNHEALTHY = 3;
    }
    ComponentStatus status = 1;
    string message = 2;
    map<string, string> details = 3;
}

// ============================================
// Photoshop Adapter
// ============================================

service PhotoshopService {
    // Document operations
    rpc CreateDocument(CreateDocumentRequest) returns (DocumentResponse);
    rpc OpenDocument(OpenDocumentRequest) returns (DocumentResponse);
    rpc SaveDocument(SaveDocumentRequest) returns (DocumentResponse);
    rpc CloseDocument(CloseDocumentRequest) returns (DocumentResponse);
    rpc GetDocumentInfo(GetDocumentInfoRequest) returns (DocumentResponse);
    rpc ListDocuments(Empty) returns (DocumentList);

    // Layer operations
    rpc GetLayers(GetLayersRequest) returns (LayerList);
    rpc CreateLayer(CreateLayerRequest) returns (LayerResponse);
    rpc DeleteLayer(DeleteLayerRequest) returns (LayerResponse);
    rpc DuplicateLayer(DuplicateLayerRequest) returns (LayerResponse);
    rpc MoveLayer(MoveLayerRequest) returns (LayerResponse);
    rpc SetLayerVisibility(SetLayerVisibilityRequest) returns (LayerResponse);
    rpc SetLayerOpacity(SetLayerOpacityRequest) returns (LayerResponse);
    rpc SetLayerBlendMode(SetLayerBlendModeRequest) returns (LayerResponse);
    rpc GetLayerBounds(GetLayerBoundsRequest) returns (LayerBoundsResponse);
    rpc ApplyLayerStyle(ApplyLayerStyleRequest) returns (LayerResponse);

    // Adjustments and filters
    rpc ApplyAdjustment(ApplyAdjustmentRequest) returns (AdjustmentResponse);
    rpc ApplyFilter(ApplyFilterRequest) returns (FilterResponse);

    // Actions
    rpc PlayAction(PlayActionRequest) returns (ActionResponse);
    rpc ListActions(ListActionsRequest) returns (ActionList);

    // Batch processing
    rpc BatchProcess(BatchProcessRequest) returns (BatchProcessResponse);

    // Export/Import
    rpc ExportDocument(ExportDocumentRequest) returns (ExportResponse);
    rpc ImportFile(ImportFileRequest) returns (ImportResponse);

    // Health
    rpc HealthCheck(Empty) returns (HealthCheckResponse);
}

// Document
message CreateDocumentRequest {
    int32 width = 1;
    int32 height = 2;
    float resolution = 3;
    ColorMode color_mode = 4;
    BackgroundContents background = 5;
    string name = 6;
}

message OpenDocumentRequest {
    string path = 1;
}

message SaveDocumentRequest {
    string document_id = 1;
    string path = 2;
    SaveOptions options = 3;
}

message CloseDocumentRequest {
    string document_id = 1;
    bool force = 2;
}

message GetDocumentInfoRequest {
    string document_id = 1;
}

message DocumentResponse {
    bool success = 1;
    DocumentInfo document = 2;
    string error = 3;
}

message DocumentList {
    repeated DocumentInfo documents = 1;
}

message DocumentInfo {
    string id = 1;
    string name = 2;
    string path = 3;
    int32 width = 4;
    int32 height = 5;
    float resolution = 6;
    ColorMode color_mode = 7;
    int32 layer_count = 8;
    bool is_modified = 9;
    bool is_background_layer = 10;
}

enum ColorMode {
    COLOR_MODE_UNSPECIFIED = 0;
    COLOR_MODE_BITMAP = 1;
    COLOR_MODE_GRAYSCALE = 2;
    COLOR_MODE_RGB = 3;
    COLOR_MODE_CMYK = 4;
    COLOR_MODE_LAB = 5;
    COLOR_MODE_MULTICHANNEL = 6;
    COLOR_MODE_DUOTONE = 7;
}

enum BackgroundContents {
    BACKGROUND_CONTENTS_UNSPECIFIED = 0;
    BACKGROUND_CONTENTS_WHITE = 1;
    BACKGROUND_CONTENTS_TRANSPARENT = 2;
    BACKGROUND_CONTENTS_BACKGROUND_COLOR = 3;
}

message SaveOptions {
    bool save_as_copy = 1;
    int32 jpeg_quality = 2;
    bool maximize_compatibility = 3;
}

// Layer
message GetLayersRequest {
    string document_id = 1;
}

message CreateLayerRequest {
    string document_id = 1;
    string name = 2;
    LayerKind kind = 3;
    int32 insert_at = 4; // -1 for top
}

message DeleteLayerRequest {
    string document_id = 1;
    string layer_id = 2;
}

message DuplicateLayerRequest {
    string document_id = 1;
    string layer_id = 2;
    string new_name = 3;
    int32 insert_at = 4;
}

message MoveLayerRequest {
    string document_id = 1;
    string layer_id = 2;
    int32 new_index = 3;
}

message SetLayerVisibilityRequest {
    string document_id = 1;
    string layer_id = 2;
    bool visible = 3;
}

message SetLayerOpacityRequest {
    string document_id = 1;
    string layer_id = 2;
    float opacity = 3; // 0.0 - 1.0
}

message SetLayerBlendModeRequest {
    string document_id = 1;
    string layer_id = 2;
    BlendMode mode = 3;
}

message GetLayerBoundsRequest {
    string document_id = 1;
    string layer_id = 2;
}

message LayerBoundsResponse {
    bool success = 1;
    LayerBounds bounds = 2;
    string error = 3;
}

message LayerBounds {
    int32 x = 1;
    int32 y = 2;
    int32 width = 3;
    int32 height = 4;
}

message ApplyLayerStyleRequest {
    string document_id = 1;
    string layer_id = 2;
    LayerStyle style = 3;
}

message LayerResponse {
    bool success = 1;
    LayerInfo layer = 2;
    string error = 3;
}

message LayerList {
    repeated LayerInfo layers = 1;
}

message LayerInfo {
    string id = 1;
    string name = 2;
    LayerKind kind = 3;
    bool visible = 4;
    float opacity = 5;
    BlendMode blend_mode = 6;
    int32 index = 7;
    bool is_background = 8;
    bool is_locked = 9;
    LayerBounds bounds = 10;
}

enum LayerKind {
    LAYER_KIND_UNSPECIFIED = 0;
    LAYER_KIND_NORMAL = 1;
    LAYER_KIND_TEXT = 2;
    LAYER_KIND_SHAPE = 3;
    LAYER_KIND_SMART_OBJECT = 4;
    LAYER_KIND_ADJUSTMENT = 5;
    LAYER_KIND_FILL = 6;
    LAYER_KIND_GROUP = 7;
    LAYER_KIND_VIDEO = 8;
    LAYER_KIND_3D = 9;
}

enum BlendMode {
    BLEND_MODE_UNSPECIFIED = 0;
    BLEND_MODE_NORMAL = 1;
    BLEND_MODE_MULTIPLY = 2;
    BLEND_MODE_SCREEN = 3;
    BLEND_MODE_OVERLAY = 4;
    BLEND_MODE_SOFT_LIGHT = 5;
    BLEND_MODE_HARD_LIGHT = 6;
    BLEND_MODE_COLOR_DODGE = 7;
    BLEND_MODE_COLOR_BURN = 8;
    BLEND_MODE_DARKEN = 9;
    BLEND_MODE_LIGHTEN = 10;
    BLEND_MODE_DIFFERENCE = 11;
    BLEND_MODE_EXCLUSION = 12;
    BLEND_MODE_HUE = 13;
    BLEND_MODE_SATURATION = 14;
    BLEND_MODE_COLOR = 15;
    BLEND_MODE_LUMINOSITY = 16;
    BLEND_MODE_LINEAR_DODGE = 17;
    BLEND_MODE_LINEAR_BURN = 18;
    BLEND_MODE_VIVID_LIGHT = 19;
    BLEND_MODE_LINEAR_LIGHT = 20;
    BLEND_MODE_PIN_LIGHT = 21;
    BLEND_MODE_HARD_MIX = 22;
    BLEND_MODE_DIVIDE = 23;
    BLEND_MODE_SUBTRACT = 24;
}

message LayerStyle {
    bool drop_shadow = 1;
    DropShadow drop_shadow_params = 2;
    bool inner_shadow = 3;
    InnerShadow inner_shadow_params = 4;
    bool outer_glow = 5;
    OuterGlow outer_glow_params = 6;
    bool inner_glow = 7;
    InnerGlow inner_glow_params = 8;
    bool bevel_emboss = 9;
    BevelEmboss bevel_emboss_params = 10;
    bool stroke = 11;
    Stroke stroke_params = 12;
    bool color_overlay = 13;
    ColorOverlay color_overlay_params = 14;
    bool gradient_overlay = 15;
    GradientOverlay gradient_overlay_params = 16;
    bool pattern_overlay = 17;
    PatternOverlay pattern_overlay_params = 18;
}

message DropShadow {
    float opacity = 1;
    float angle = 2;
    float distance = 3;
    float spread = 4;
    float size = 5;
    int32 color_r = 6;
    int32 color_g = 7;
    int32 color_b = 8;
}

message InnerShadow {
    float opacity = 1;
    float angle = 2;
    float distance = 3;
    float choke = 4;
    float size = 5;
    int32 color_r = 6;
    int32 color_g = 7;
    int32 color_b = 8;
}

message OuterGlow {
    float opacity = 1;
    float spread = 2;
    float size = 3;
    int32 color_r = 4;
    int32 color_g = 5;
    int32 color_b = 6;
}

message InnerGlow {
    float opacity = 1;
    float choke = 2;
    float size = 3;
    int32 color_r = 4;
    int32 color_g = 5;
    int32 color_b = 6;
}

message BevelEmboss {
    BevelStyle style = 1;
    BevelTechnique technique = 2;
    float depth = 3;
    float direction = 4;
    float size = 5;
    float soften = 6;
    float angle = 7;
    float altitude = 8;
    HighlightShadow highlight = 9;
    HighlightShadow shadow = 10;
}

enum BevelStyle {
    BEVEL_STYLE_UNSPECIFIED = 0;
    BEVEL_STYLE_OUTER = 1;
    BEVEL_STYLE_INNER = 2;
    BEVEL_STYLE_EMBOSS = 3;
    BEVEL_STYLE_PILLOW_EMBOSS = 4;
    BEVEL_STYLE_STROKE_EMBOSS = 5;
}

enum BevelTechnique {
    BEVEL_TECHNIQUE_UNSPECIFIED = 0;
    BEVEL_TECHNIQUE_SMOOTH = 1;
    BEVEL_TECHNIQUE_CHISEL_HARD = 2;
    BEVEL_TECHNIQUE_CHISEL_SOFT = 3;
}

message HighlightShadow {
    int32 color_r = 1;
    int32 color_g = 2;
    int32 color_b = 3;
    int32 color_a = 4;
    BlendMode blend_mode = 5;
    float opacity = 6;
}

message Stroke {
    float size = 1;
    StrokePosition position = 2;
    BlendMode blend_mode = 3;
    float opacity = 4;
    FillType fill_type = 5;
    ColorFill color = 6;
    GradientFill gradient = 7;
    PatternFill pattern = 8;
}

enum StrokePosition {
    STROKE_POSITION_UNSPECIFIED = 0;
    STROKE_POSITION_OUTSIDE = 1;
    STROKE_POSITION_INSIDE = 2;
    STROKE_POSITION_CENTER = 3;
}

enum FillType {
    FILL_TYPE_UNSPECIFIED = 0;
    FILL_TYPE_COLOR = 1;
    FILL_TYPE_GRADIENT = 2;
    FILL_TYPE_PATTERN = 3;
}

message ColorFill {
    int32 r = 1;
    int32 g = 2;
    int32 b = 3;
    int32 a = 4;
}

message GradientFill {
    GradientType type = 1;
    float angle = 2;
    float scale = 3;
    repeated GradientStop stops = 4;
}

enum GradientType {
    GRADIENT_TYPE_UNSPECIFIED = 0;
    GRADIENT_TYPE_LINEAR = 1;
    GRADIENT_TYPE_RADIAL = 2;
    GRADIENT_TYPE_ANGLE = 3;
    GRADIENT_TYPE_REFLECTED = 4;
    GRADIENT_TYPE_DIAMOND = 5;
}

message GradientStop {
    float location = 1;
    int32 r = 2;
    int32 g = 3;
    int32 b = 4;
    int32 a = 5;
}

message PatternFill {
    string pattern_name = 1;
    float scale = 2;
}

message ColorOverlay {
    int32 r = 1;
    int32 g = 2;
    int32 b = 3;
    int32 a = 4;
    BlendMode blend_mode = 5;
    float opacity = 6;
}

message GradientOverlay {
    BlendMode blend_mode = 1;
    float opacity = 2;
    GradientFill gradient = 3;
}

message PatternOverlay {
    BlendMode blend_mode = 1;
    float opacity = 2;
    PatternFill pattern = 3;
}

// Adjustments
message ApplyAdjustmentRequest {
    string document_id = 1;
    string layer_id = 2; // empty for document-level
    AdjustmentType type = 3;
    map<string, string> parameters = 4;
}

message AdjustmentResponse {
    bool success = 1;
    string adjustment_id = 2;
    string error = 3;
}

enum AdjustmentType {
    ADJUSTMENT_TYPE_UNSPECIFIED = 0;
    ADJUSTMENT_TYPE_BRIGHTNESS_CONTRAST = 1;
    ADJUSTMENT_TYPE_LEVELS = 2;
    ADJUSTMENT_TYPE_CURVES = 3;
    ADJUSTMENT_TYPE_EXPOSURE = 4;
    ADJUSTMENT_TYPE_VIBRANCE = 5;
    ADJUSTMENT_TYPE_HUE_SATURATION = 6;
    ADJUSTMENT_TYPE_COLOR_BALANCE = 7;
    ADJUSTMENT_TYPE_BLACK_WHITE = 8;
    ADJUSTMENT_TYPE_PHOTO_FILTER = 9;
    ADJUSTMENT_TYPE_CHANNEL_MIXER = 10;
    ADJUSTMENT_TYPE_INVERT = 11;
    ADJUSTMENT_TYPE_POSTERIZE = 12;
    ADJUSTMENT_TYPE_THRESHOLD = 13;
    ADJUSTMENT_TYPE_GRADIENT_MAP = 14;
    ADJUSTMENT_TYPE_SELECTIVE_COLOR = 15;
}

// Filters
message ApplyFilterRequest {
    string document_id = 1;
    string layer_id = 2;
    FilterType type = 3;
    map<string, string> parameters = 4;
    bool smart_filter = 5;
}

message FilterResponse {
    bool success = 1;
    string filter_id = 2;
    string error = 3;
}

enum FilterType {
    FILTER_TYPE_UNSPECIFIED = 0;
    FILTER_TYPE_GAUSSIAN_BLUR = 1;
    FILTER_TYPE_MOTION_BLUR = 2;
    FILTER_TYPE_RADIAL_BLUR = 3;
    FILTER_TYPE_SMART_BLUR = 4;
    FILTER_TYPE_UNSHARP_MASK = 5;
    FILTER_TYPE_SHARPEN = 6;
    FILTER_TYPE_SHARPEN_EDGES = 7;
    FILTER_TYPE_SHARPEN_MORE = 8;
    FILTER_TYPE_REDUCE_NOISE = 9;
    FILTER_TYPE_DESPECKLE = 10;
    FILTER_TYPE_MEDIAN = 11;
    FILTER_TYPE_DUST_SCRATCHES = 12;
    FILTER_TYPE_ADD_NOISE = 13;
    FILTER_TYPE_EMBOSS = 14;
    FILTER_TYPE_FIND_EDGES = 15;
    FILTER_TYPE_HIGH_PASS = 16;
    FILTER_TYPE_MINIMUM = 17;
    FILTER_TYPE_MAXIMUM = 18;
    FILTER_TYPE_OFFSET = 19;
    FILTER_TYPE_SPHERIZE = 20;
    FILTER_TYPE_RIPPLE = 21;
    FILTER_TYPE_WAVE = 22;
    FILTER_TYPE_ZIGZAG = 23;
    FILTER_TYPE_LENS_FLARE = 24;
    FILTER_TYPE_LIGHTING_EFFECTS = 25;
    FILTER_TYPE_OIL_PAINT = 26;
    FILTER_TYPE_FILTER_GALLERY = 27;
}

// Actions
message PlayActionRequest {
    string action_name = 1;
    string action_set = 2;
    string document_id = 3;
    map<string, string> parameters = 4;
}

message ActionResponse {
    bool success = 1;
    string error = 2;
}

message ListActionsRequest {
    string action_set = 1;
}

message ActionList {
    repeated ActionInfo actions = 1;
}

message ActionInfo {
    string name = 1;
    string action_set = 2;
    bool has_parameters = 3;
}

// Batch
message BatchProcessRequest {
    string action_name = 1;
    string action_set = 2;
    repeated string source_files = 3;
    string destination_folder = 4;
    BatchOptions options = 5;
}

message BatchOptions {
    bool override_open = 1;
    bool include_subfolders = 2;
    bool suppress_warnings = 3;
    string file_naming = 4;
    SaveOptions save_options = 5;
}

message BatchProcessResponse {
    bool success = 1;
    int32 processed = 2;
    int32 failed = 3;
    repeated string errors = 4;
}

// Export/Import
message ExportDocumentRequest {
    string document_id = 1;
    string path = 2;
    ExportFormat format = 3;
    ExportOptions options = 4;
}

message ExportOptions {
    int32 quality = 1;
    bool include_icc_profile = 2;
    bool convert_to_srgb = 3;
    bool transparency = 4;
    int32 png_compression = 5;
}

enum ExportFormat {
    EXPORT_FORMAT_UNSPECIFIED = 0;
    EXPORT_FORMAT_PSD = 1;
    EXPORT_FORMAT_PSB = 2;
    EXPORT_FORMAT_JPEG = 3;
    EXPORT_FORMAT_PNG = 4;
    EXPORT_FORMAT_TIFF = 5;
    EXPORT_FORMAT_GIF = 6;
    EXPORT_FORMAT_BMP = 7;
    EXPORT_FORMAT_PDF = 8;
    EXPORT_FORMAT_SVG = 9;
    EXPORT_FORMAT_WEBP = 10;
}

message ExportResponse {
    bool success = 1;
    string path = 2;
    string error = 3;
}

message ImportFileRequest {
    string path = 1;
    string document_id = 2; // optional target document
    ImportOptions options = 3;
}

message ImportOptions {
    bool place_as_smart_object = 1;
    bool convert_to_profile = 2;
    int32 target_layer_index = 3;
}

message ImportResponse {
    bool success = 1;
    string layer_id = 2;
    string error = 3;
}

// ============================================
// Chrome Adapter (CDP)
// ============================================

service ChromeService {
    // Browser lifecycle
    rpc Connect(ConnectRequest) returns (ConnectResponse);
    rpc Disconnect(DisconnectRequest) returns (Empty);
    rpc GetVersion(Empty) returns (VersionResponse);
    rpc GetTargets(GetTargetsRequest) returns (TargetList);

    // Tab management
    rpc CreateTab(CreateTabRequest) returns (TabResponse);
    rpc CloseTab(CloseTabRequest) returns (TabResponse);
    rpc ActivateTab(ActivateTabRequest) returns (TabResponse);
    rpc Navigate(NavigateRequest) returns (NavigationResponse);
    rpc Reload(ReloadRequest) returns (NavigationResponse);
    rpc GoBack(GoBackRequest) returns (NavigationResponse);
    rpc GoForward(GoForwardRequest) returns (NavigationResponse);
    rpc GetTabs(Empty) returns (TabList);

    // DOM interaction
    rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
    rpc CallFunction(CallFunctionRequest) returns (EvaluateResponse);
    rpc GetDocument(GetDocumentRequest) returns (NodeResponse);
    rpc QuerySelector(QuerySelectorRequest) returns (NodeResponse);
    rpc QuerySelectorAll(QuerySelectorAllRequest) returns (NodeList);
    rpc ClickElement(ClickElementRequest) returns (ClickResponse);
    rpc TypeText(TypeTextRequest) returns (TypeResponse);
    rpc GetElementBounds(GetElementBoundsRequest) returns (ElementBoundsResponse);
    rpc GetElementAttributes(GetElementAttributesRequest) returns (ElementAttributesResponse);
    rpc SetElementAttributes(SetElementAttributesRequest) returns (ElementAttributesResponse);
    rpc ScreenshotElement(ScreenshotElementRequest) returns (ScreenshotResponse);
    rpc ScrollIntoView(ScrollIntoViewRequest) returns (Empty);

    // Network interception
    rpc EnableNetwork(EnableNetworkRequest) returns (Empty);
    rpc DisableNetwork(Empty) returns (Empty);
    rpc SetRequestInterception(SetRequestInterceptionRequest) returns (Empty);
    rpc ContinueRequest(ContinueRequestRequest) returns (Empty);
    rpc ModifyRequest(ModifyRequestRequest) returns (Empty);
    rpc BlockUrls(BlockUrlsRequest) returns (Empty);
    rpc GetNetworkLogs(Empty) returns (NetworkLogList);

    // Console
    rpc EnableConsole(Empty) returns (Empty);
    rpc DisableConsole(Empty) returns (Empty);
    rpc GetConsoleLogs(Empty) returns (ConsoleLogList);
    rpc ClearConsole(Empty) returns (Empty);

    // Screenshots
    rpc CaptureScreenshot(CaptureScreenshotRequest) returns (ScreenshotResponse);
    rpc CaptureFullPageScreenshot(CaptureFullPageScreenshotRequest) returns (ScreenshotResponse);

    // Cookies/Storage
    rpc GetCookies(GetCookiesRequest) returns (CookieList);
    rpc SetCookie(SetCookieRequest) returns (CookieResponse);
    rpc DeleteCookie(DeleteCookieRequest) returns (CookieResponse);
    rpc GetLocalStorage(GetLocalStorageRequest) returns (StorageResponse);
    rpc SetLocalStorage(SetLocalStorageRequest) returns (StorageResponse);

    // Health
    rpc HealthCheck(Empty) returns (HealthCheckResponse);
}

// Browser
message ConnectRequest {
    string endpoint = 1; // e.g., "http://localhost:9222"
    int32 timeout_ms = 2;
}

message ConnectResponse {
    bool success = 1;
    string session_id = 2;
    string error = 3;
}

message DisconnectRequest {
    string session_id = 1;
}

message VersionResponse {
    bool success = 1;
    BrowserVersion version = 2;
    string error = 3;
}

message BrowserVersion {
    string protocol_version = 1;
    string product = 2;
    string revision = 3;
    string user_agent = 4;
    string js_version = 5;
}

message GetTargetsRequest {
    string session_id = 1;
}

message TargetList {
    repeated TargetInfo targets = 1;
}

message TargetInfo {
    string target_id = 1;
    TargetType type = 2;
    string title = 3;
    string url = 4;
    bool attached = 5;
    string opener_id = 6;
}

enum TargetType {
    TARGET_TYPE_UNSPECIFIED = 0;
    TARGET_TYPE_PAGE = 1;
    TARGET_TYPE_BACKGROUND_PAGE = 2;
    TARGET_TYPE_SERVICE_WORKER = 3;
    TARGET_TYPE_SHARED_WORKER = 4;
    TARGET_TYPE_IFRAME = 5;
    TARGET_TYPE_WORKER = 6;
    TARGET_TYPE_OTHER = 7;
}

// Tabs
message CreateTabRequest {
    string session_id = 1;
    string url = 2;
    bool background = 3;
}

message CloseTabRequest {
    string session_id = 1;
    string target_id = 2;
}

message ActivateTabRequest {
    string session_id = 1;
    string target_id = 2;
}

message TabResponse {
    bool success = 1;
    TabInfo tab = 2;
    string error = 3;
}

message TabList {
    repeated TabInfo tabs = 1;
}

message TabInfo {
    string target_id = 1;
    string title = 2;
    string url = 3;
    bool is_active = 4;
    bool is_loading = 5;
    string favicon_url = 6;
}

message NavigateRequest {
    string session_id = 1;
    string target_id = 2;
    string url = 3;
    NavigationOptions options = 4;
}

message NavigationOptions {
    int32 timeout_ms = 1;
    bool wait_until_load = 2;
    bool wait_until_domcontentloaded = 3;
    bool wait_until_networkidle = 4;
    string referrer = 5;
    map<string, string> headers = 6;
}

message NavigationResponse {
    bool success = 1;
    string frame_id = 2;
    string loader_id = 3;
    NavigationError error = 4;
}

message NavigationError {
    string error_text = 1;
    int32 error_code = 2;
}

message ReloadRequest {
    string session_id = 1;
    string target_id = 2;
    bool ignore_cache = 3;
}

message GoBackRequest {
    string session_id = 1;
    string target_id = 2;
}

message GoForwardRequest {
    string session_id = 1;
    string target_id = 2;
}

// DOM
message EvaluateRequest {
    string session_id = 1;
    string target_id = 2;
    string expression = 3;
    EvaluateOptions options = 4;
}

message EvaluateOptions {
    bool return_by_value = 1;
    bool await_promise = 2;
    bool user_gesture = 3;
    string object_group = 4;
    bool include_command_line_api = 5;
    bool silent = 6;
    int32 timeout_ms = 7;
}

message EvaluateResponse {
    bool success = 1;
    RemoteObject result = 2;
    ExceptionDetails exception = 3;
    string error = 4;
}

message RemoteObject {
    RemoteObjectType type = 1;
    string subtype = 2;
    string class_name = 3;
    string value = 4; // JSON stringified
    string object_id = 5;
    string description = 6;
    int32 preview_length = 7;
}

enum RemoteObjectType {
    REMOTE_OBJECT_TYPE_UNSPECIFIED = 0;
    REMOTE_OBJECT_TYPE_OBJECT = 1;
    REMOTE_OBJECT_TYPE_FUNCTION = 2;
    REMOTE_OBJECT_TYPE_UNDEFINED = 3;
    REMOTE_OBJECT_TYPE_STRING = 4;
    REMOTE_OBJECT_TYPE_NUMBER = 5;
    REMOTE_OBJECT_TYPE_BOOLEAN = 6;
    REMOTE_OBJECT_TYPE_SYMBOL = 7;
    REMOTE_OBJECT_TYPE_BIGINT = 8;
}

message ExceptionDetails {
    int32 exception_id = 1;
    string text = 2;
    string line_number = 3;
    string column_number = 4;
    string script_id = 5;
    string url = 8;
    RemoteObject exception = 6;
    string stack_trace = 7;
}

message CallFunctionRequest {
    string session_id = 1;
    string target_id = 2;
    string function_declaration = 3;
    repeated RemoteObject arguments = 4;
    EvaluateOptions options = 5;
}

message GetDocumentRequest {
    string session_id = 1;
    string target_id = 2;
    int32 depth = 3;
    bool pierce = 4;
}

message NodeResponse {
    bool success = 1;
    NodeInfo node = 2;
    string error = 3;
}

message NodeList {
    repeated NodeInfo nodes = 1;
}

message NodeInfo {
    int64 node_id = 1;
    NodeType node_type = 2;
    string node_name = 3;
    string local_name = 4;
    string node_value = 5;
    int32 child_count = 6;
    repeated NodeInfo children = 7;
    map<string, string> attributes = 8;
    string frame_id = 9;
    int32 depth = 10;
}

enum NodeType {
    NODE_TYPE_UNSPECIFIED = 0;

}

message StorageResponse {
    bool success = 1;
    map<string, string> items = 2;
    string error = 3;
}

// ============================================
// Game Memory Adapter
// ============================================

service GameService {
    // Process attachment
    rpc AttachProcess(AttachProcessRequest) returns (AttachResponse);
    rpc DetachProcess(DetachProcessRequest) returns (Empty);
    rpc GetProcessInfo(GetProcessInfoRequest) returns (ProcessInfoResponse);
    rpc ListProcesses(ListProcessesRequest) returns (ProcessList);
    rpc FindProcessByName(FindProcessByNameRequest) returns (ProcessInfoResponse);
    rpc FindProcessByWindow(FindProcessByWindowRequest) returns (ProcessInfoResponse);

    // Memory reading
    rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);
    rpc ReadPointerChain(ReadPointerChainRequest) returns (ReadMemoryResponse);
    rpc ReadString(ReadStringRequest) returns (ReadStringResponse);
    rpc ReadStruct(ReadStructRequest) returns (ReadStructResponse);

    // Memory writing
    rpc WriteMemory(WriteMemoryRequest) returns (WriteMemoryResponse);
    rpc WritePointerChain(WritePointerChainRequest) returns (WriteMemoryResponse);
    rpc WriteString(WriteStringRequest) returns (WriteMemoryResponse);
    rpc WriteStruct(WriteStructRequest) returns (WriteMemoryResponse);

    // Pattern scanning
    rpc ScanPattern(ScanPatternRequest) returns (ScanPatternResponse);
    rpc ScanPatternModule(ScanPatternModuleRequest) returns (ScanPatternResponse);
    rpc FindPattern(FindPatternRequest) returns (FindPatternResponse);

    // Code injection
    rpc AllocateMemory(AllocateMemoryRequest) returns (AllocateMemoryResponse);
    rpc FreeMemory(FreeMemoryRequest) returns (Empty);
    rpc InjectCode(InjectCodeRequest) returns (InjectCodeResponse);
    rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
    rpc InjectDll(InjectDllRequest) returns (InjectDllResponse);
    rpc SetHook(SetHookRequest) returns (HookResponse);
    rpc RemoveHook(RemoveHookRequest) returns (HookResponse);

    // Modules
    rpc GetModules(Empty) returns (ModuleList);
    rpc GetModuleBase(GetModuleBaseRequest) returns (ModuleBaseResponse);
    rpc GetModuleExport(GetModuleExportRequest) returns (ModuleExportResponse);

    // Health
    rpc HealthCheck(Empty) returns (HealthCheckResponse);
}

// Process
message AttachProcessRequest {
    uint32 pid = 1;
    AccessRights access = 2;
}

enum AccessRights {
    ACCESS_RIGHTS_UNSPECIFIED = 0;
    ACCESS_RIGHTS_READ = 1;
    ACCESS_RIGHTS_WRITE = 2;
    ACCESS_RIGHTS_READ_WRITE = 3;
    ACCESS_RIGHTS_ALL = 4;
}

message AttachResponse {
    bool success = 1;
    uint32 pid = 2;
    string process_name = 3;
    string error = 4;
}

message DetachProcessRequest {
    uint32 pid = 1;
}

message GetProcessInfoRequest {
    uint32 pid = 1;
}

message ProcessInfoResponse {
    bool success = 1;
    ProcessInfo process = 2;
    string error = 3;
}

message ProcessInfo {
    uint32 pid = 1;
    string name = 2;
    string path = 3;
    uint64 base_address = 4;
    Architecture arch = 5;
    bool is_64bit = 6;
    uint32 parent_pid = 7;
    uint32 session_id = 8;
    uint64 memory_usage = 9;
    string command_line = 10;
}

enum Architecture {
    ARCHITECTURE_UNSPECIFIED = 0;
    ARCHITECTURE_X86 = 1;
    ARCHITECTURE_X64 = 2;
    ARCHITECTURE_ARM = 3;
    ARCHITECTURE_ARM64 = 4;
}

message ListProcessesRequest {
    string name_filter = 1;
}

message ProcessList {
    repeated ProcessInfo processes = 1;
}

message FindProcessByNameRequest {
    string name = 1;
}

message FindProcessByWindowRequest {
    string window_title = 1;
    string class_name = 2;
}

// Memory
message ReadMemoryRequest {
    uint32 pid = 1;
    uint64 address = 2;
    uint32 size = 3;
}

message ReadMemoryResponse {
    bool success = 1;
    bytes data = 2;
    string error = 3;
}

message ReadPointerChainRequest {
    uint32 pid = 1;
    uint64 base_address = 2;
    repeated uint64 offsets = 3;
    uint32 size = 4;
}

message ReadStringRequest {
    uint32 pid = 1;
    uint64 address = 2;
    uint32 max_length = 3;
    StringEncoding encoding = 4;
}

enum StringEncoding {
    STRING_ENCODING_UNSPECIFIED = 0;
    STRING_ENCODING_ASCII = 1;
    STRING_ENCODING_UTF8 = 2;
    STRING_ENCODING_UTF16 = 3;
    STRING_ENCODING_UTF16LE = 4;
    STRING_ENCODING_UTF16BE = 5;
}

message ReadStringResponse {
    bool success = 1;
    string value = 2;
    string error = 3;
}

message ReadStructRequest {
    uint32 pid = 1;
    uint64 address = 2;
    string struct_definition = 3; // JSON struct definition
}

message ReadStructResponse {
    bool success = 1;
    string json_value = 2; // JSON serialized struct
    string error = 3;
}

message WriteMemoryRequest {
    uint32 pid = 1;
    uint64 address = 2;
    bytes data = 3;
}

message WriteMemoryResponse {
    bool success = 1;
    uint32 bytes_written = 2;
    string error = 3;
}

message WritePointerChainRequest {
    uint32 pid = 1;
    uint64 base_address = 2;
    repeated uint64 offsets = 3;
    bytes data = 4;
}

message WriteStringRequest {
    uint32 pid = 1;
    uint64 address = 2;
    string value = 3;
    StringEncoding encoding = 4;
}

message WriteStructRequest {
    uint32 pid = 1;
    uint64 address = 2;
    string json_value = 3; // JSON serialized struct
    string struct_definition = 4;
}

// Pattern scanning
message ScanPatternRequest {
    uint32 pid = 1;
    string pattern = 2; // IDA-style pattern (e.g., "48 8B 05 ?? ?? ?? ?? 48 85 C0")
    uint64 start_address = 3;
    uint64 end_address = 4;
    ScanOptions options = 5;
}

message ScanPatternModuleRequest {
    uint32 pid = 1;
    string module_name = 2;
    string pattern = 3;
    ScanOptions options = 4;
}

message ScanOptions {
    bool writable = 1;
    bool executable = 2;
    bool readable = 3;
    int32 max_results = 4;
    bool case_sensitive = 5;
}

message ScanPatternResponse {
    bool success = 1;
    repeated uint64 addresses = 2;
    string error = 3;
}

message FindPatternRequest {
    uint32 pid = 1;
    bytes pattern = 2;
    string mask = 3; // 'x' for match, '?' for wildcard
    uint64 start_address = 4;
    uint64 end_address = 5;
}

message FindPatternResponse {
    bool success = 1;
    repeated uint64 addresses = 2;
    string error = 3;
}

// Code injection
message AllocateMemoryRequest {
    uint32 pid = 1;
    uint32 size = 2;
    MemoryProtection protection = 3;
    AllocationType type = 4;
    uint64 preferred_address = 5;
}

enum MemoryProtection {
    MEMORY_PROTECTION_UNSPECIFIED = 0;
    MEMORY_PROTECTION_READ = 1;
    MEMORY_PROTECTION_WRITE = 2;
    MEMORY_PROTECTION_EXECUTE = 3;
    MEMORY_PROTECTION_READ_WRITE = 4;
    MEMORY_PROTECTION_READ_EXECUTE = 5;
    MEMORY_PROTECTION_READ_WRITE_EXECUTE = 6;
    MEMORY_PROTECTION_NO_ACCESS = 7;
}

enum AllocationType {
    ALLOCATION_TYPE_UNSPECIFIED = 0;
    ALLOCATION_TYPE_COMMIT = 1;
    ALLOCATION_TYPE_RESERVE = 2;
    ALLOCATION_TYPE_COMMIT_RESERVE = 3;
}

message AllocateMemoryResponse {
    bool success = 1;
    uint64 address = 2;
    string error = 3;
}

message FreeMemoryRequest {
    uint32 pid = 1;
    uint64 address = 2;
    uint32 size = 3;
}

message InjectCodeRequest {
    uint32 pid = 1;
    bytes shellcode = 2;
    uint64 target_address = 3; // optional, auto-allocate if 0
    InjectOptions options = 4;
}

message InjectOptions {
    bool create_thread = 1;
    bool suspend_thread = 2;
    uint64 parameter = 3;
    bool restore_context = 4;
}

message InjectCodeResponse {
    bool success = 1;
    uint64 allocated_address = 2;
    uint32 thread_id = 3;
    string error = 4;
}

message CreateThreadRequest {
    uint32 pid = 1;
    uint64 start_address = 2;
    uint64 parameter = 3;
    bool suspended = 4;
}

message CreateThreadResponse {
    bool success = 1;
    uint32 thread_id = 2;
    uint64 thread_handle = 3;
    string error = 4;
}

message InjectDllRequest {
    uint32 pid = 1;
    string dll_path = 2;
    InjectionMethod method = 3;
}

enum InjectionMethod {
    INJECTION_METHOD_UNSPECIFIED = 0;
    INJECTION_METHOD_LOAD_LIBRARY = 1;
    INJECTION_METHOD_MANUAL_MAPPING = 2;
    INJECTION_METHOD_THREAD_HIJACKING = 3;
}

message InjectDllResponse {
    bool success = 1;
    uint64 base_address = 2;
    string error = 3;
}

message SetHookRequest {
    uint32 pid = 1;
    uint64 target_address = 2;
    uint64 detour_address = 3;
    HookType type = 4;
    HookOptions options = 5;
}

enum HookType {
    HOOK_TYPE_UNSPECIFIED = 0;
    HOOK_TYPE_JMP = 1;
    HOOK_TYPE_CALL = 2;
    HOOK_TYPE_VEH = 3; // Vectored Exception Handler
    HOOK_TYPE_IAT = 4; // Import Address Table
    HOOK_TYPE_INLINE = 5;
}

message HookOptions {
    bool auto_enable = 1;
    uint32 original_bytes_size = 2;
}

message HookResponse {
    bool success = 1;
    uint64 hook_id = 2;
    bytes original_bytes = 3;
    string error = 4;
}

message RemoveHookRequest {
    uint32 pid = 1;
    uint64 hook_id = 2;
}

// Modules
message ModuleList {
    repeated ModuleInfo modules = 1;
}

message ModuleInfo {
    string name = 1;
    uint64 base_address = 2;
    uint32 size = 3;
    string path = 4;
    bool is_main = 5;
    Architecture arch = 6;
}

message GetModuleBaseRequest {
    uint32 pid = 1;
    string module_name = 2;
}

message ModuleBaseResponse {
    bool success = 1;
    uint64 base_address = 2;
    string error = 3;
}

message GetModuleExportRequest {
    uint32 pid = 1;
    string module_name = 3;
    string export_name = 2;
}

message ModuleExportResponse {
    bool success = 1;
    uint64 address = 2;
    string error = 3;
}

// ============================================
// Window Manager Adapter
// ============================================

service WindowService {
    // Window enumeration
    rpc ListWindows(ListWindowsRequest) returns (WindowList);
    rpc GetWindow(GetWindowRequest) returns (WindowResponse);
    rpc FindWindow(FindWindowRequest) returns (WindowResponse);
    rpc GetForegroundWindow(Empty) returns (WindowResponse);
    rpc GetDesktopWindow(Empty) returns (WindowResponse);
    rpc GetShellWindow(Empty) returns (WindowResponse);

    // Window state
    rpc FocusWindow(FocusWindowRequest) returns (WindowResponse);
    rpc ActivateWindow(ActivateWindowRequest) returns (WindowResponse);
    rpc ShowWindow(ShowWindowRequest) returns (WindowResponse);
    rpc HideWindow(HideWindowRequest) returns (WindowResponse);
    rpc MinimizeWindow(MinimizeWindowRequest) returns (WindowResponse);
    rpc MaximizeWindow(MaximizeWindowRequest) returns (WindowResponse);
    rpc RestoreWindow(RestoreWindowRequest) returns (WindowResponse);
    rpc CloseWindow(CloseWindowRequest) returns (WindowResponse);
    rpc IsWindowVisible(IsWindowVisibleRequest) returns (WindowVisibilityResponse);
    rpc IsWindowEnabled(IsWindowEnabledRequest) returns (WindowEnabledResponse);
    rpc GetWindowState(GetWindowStateRequest) returns (WindowStateResponse);

    // Position/Size
    rpc MoveWindow(MoveWindowRequest) returns (WindowResponse);
    rpc ResizeWindow(ResizeWindowRequest) returns (WindowResponse);
    rpc MoveResizeWindow(MoveResizeWindowRequest) returns (WindowResponse);
    rpc GetWindowRect(GetWindowRectRequest) returns (WindowRectResponse);
    rpc GetClientRect(GetClientRectRequest) returns (WindowRectResponse);
    rpc SetWindowPos(SetWindowPosRequest) returns (WindowResponse);

    // Screenshot
    rpc CaptureWindow(CaptureWindowRequest) returns (ScreenshotResponse);
    rpc CaptureClientArea(CaptureClientAreaRequest) returns (ScreenshotResponse);
    rpc CaptureRegion(CaptureRegionRequest) returns (ScreenshotResponse);

    // Window properties
    rpc GetWindowTitle(GetWindowTitleRequest) returns (WindowTitleResponse);
    rpc SetWindowTitle(SetWindowTitleRequest) returns (WindowResponse);
    rpc GetWindowClass(GetWindowClassRequest) returns (WindowClassResponse);
    rpc GetWindowProcessId(GetWindowProcessIdRequest) returns (WindowProcessIdResponse);
    rpc GetWindowStyles(GetWindowStylesRequest) returns (WindowStylesResponse);
    rpc SetWindowStyles(SetWindowStylesRequest) returns (WindowResponse);
    rpc GetWindowExStyles(GetWindowExStylesRequest) returns (WindowStylesResponse);
    rpc SetWindowExStyles(SetWindowExStylesRequest) returns (WindowResponse);

    // Z-order
    rpc BringToTop(BringToTopRequest) returns (WindowResponse);
    rpc SendToBottom(SendToBottomRequest) returns (WindowResponse);
    rpc SetWindowZOrder(SetWindowZOrderRequest) returns (WindowResponse);

    // Input
    rpc SetFocus(SetFocusRequest) returns (WindowResponse);
    rpc GetFocus(Empty) returns (WindowResponse);
    rpc PostMessage(PostMessageRequest) returns (MessageResponse);
    rpc SendMessage(SendMessageRequest) returns (MessageResponse);

    // Multi-monitor
    rpc GetMonitors(Empty) returns (MonitorList);
    rpc GetWindowMonitor(GetWindowMonitorRequest) returns (MonitorResponse);

    // Health
    rpc HealthCheck(Empty) returns (HealthCheckResponse);
}

// Window
message ListWindowsRequest {
    bool visible_only = 1;
    bool enabled_only = 2;
    string class_filter = 3;
    string title_filter = 4;
    uint32 process_id_filter = 5;
}

message WindowList {
    repeated WindowInfo windows = 1;
}

message WindowInfo {
    uint64 handle = 1;
    string title = 2;
    string class_name = 3;
    uint32 process_id = 4;
    uint32 thread_id = 5;
    WindowRect rect = 6;
    WindowRect client_rect = 7;
    bool is_visible = 8;
    bool is_enabled = 9;
    bool is_minimized = 10;
    bool is_maximized = 11;
    bool is_foreground = 12;
    WindowStyles styles = 13;
    WindowStyles ex_styles = 14;
    int32 z_order = 15;
    uint64 parent_handle = 16;
    uint64 owner_handle = 17;
}

message WindowRect {
    int32 left = 1;
    int32 top = 2;
    int32 right = 3;
    int32 bottom = 4;
    int32 width = 5;
    int32 height = 6;
}

message WindowStyles {
    uint32 style = 1;
    bool ws_overlapped = 2;
    bool ws_popup = 3;
    bool ws_child = 4;
    bool ws_minimize = 5;
    bool ws_maximize = 6;
    bool ws_caption = 7;
    bool ws_border = 8;
    bool ws_dlgframe = 9;
    bool ws_vscroll = 10;
    bool ws_hscroll = 11;
    bool ws_sysmenu = 12;
    bool ws_thickframe = 13;
    bool ws_group = 14;
    bool ws_tabstop = 15;
    bool ws_minimizebox = 16;
    bool ws_maximizebox = 17;
    bool ws_disabled = 18;
    bool ws_visible = 19;
    bool ws_clipchildren = 20;
    bool ws_clipsiblings = 21;
}

message GetWindowRequest {
    uint64 handle = 1;
}

message WindowResponse {
    bool success = 1;
    WindowInfo window = 2;
    string error = 3;
}

message FindWindowRequest {
    string class_name = 1;
    string window_title = 2;
}

message FocusWindowRequest {
    uint64 handle = 1;
}

message ActivateWindowRequest {
    uint64 handle = 1;
}

message ShowWindowRequest {
    uint64 handle = 1;
    ShowCommand command = 2;
}

enum ShowCommand {
    option allow_alias = true;
    SHOW_COMMAND_UNSPECIFIED = 0;
    SHOW_COMMAND_HIDE = 0;
    SHOW_COMMAND_NORMAL = 1;
    SHOW_COMMAND_MINIMIZED = 2;
    SHOW_COMMAND_MAXIMIZED = 3;
    SHOW_COMMAND_SHOW_NOACTIVATE = 4;
    SHOW_COMMAND_SHOW = 5;
    SHOW_COMMAND_MINIMIZE = 6;
    SHOW_COMMAND_SHOW_MINNOACTIVE = 7;
    SHOW_COMMAND_SHOW_NA = 8;
    SHOW_COMMAND_RESTORE = 9;
    SHOW_COMMAND_SHOW_DEFAULT = 10;
    SHOW_COMMAND_FORCE_MINIMIZE = 11;
}

message HideWindowRequest {
    uint64 handle = 1;
}

message MinimizeWindowRequest {
    uint64 handle = 1;
}

message MaximizeWindowRequest {
    uint64 handle = 1;
}

message RestoreWindowRequest {
    uint64 handle = 1;
}

message CloseWindowRequest {
    uint64 handle = 1;
}

message IsWindowVisibleRequest {
    uint64 handle = 1;
}

message WindowVisibilityResponse {
    bool success = 1;
    bool visible = 2;
    string error = 3;
}

message IsWindowEnabledRequest {
    uint64 handle = 1;
}

message WindowEnabledResponse {
    bool success = 1;
    bool enabled = 2;
    string error = 3;
}

message GetWindowStateRequest {
    uint64 handle = 1;
}

message WindowStateResponse {
    bool success = 1;
    WindowState state = 2;
    string error = 3;
}

enum WindowState {
    WINDOW_STATE_UNSPECIFIED = 0;
    WINDOW_STATE_NORMAL = 1;
    WINDOW_STATE_MINIMIZED = 2;
    WINDOW_STATE_MAXIMIZED = 3;
    WINDOW_STATE_HIDDEN = 4;
}

message MoveWindowRequest {
    uint64 handle = 1;
    int32 x = 2;
    int32 y = 3;
    bool repaint = 4;
}

message ResizeWindowRequest {
    uint64 handle = 1;
    int32 width = 2;
    int32 height = 3;
    bool repaint = 4;
}

message MoveResizeWindowRequest {
    uint64 handle = 1;
    int32 x = 2;
    int32 y = 3;
    int32 width = 4;
    int32 height = 5;
    bool repaint = 6;
}

message GetWindowRectRequest {
    uint64 handle = 1;
}

message GetClientRectRequest {
    uint64 handle = 1;
}

message WindowRectResponse {
    bool success = 1;
    WindowRect rect = 2;
    string error = 3;
}

message SetWindowPosRequest {
    uint64 handle = 1;
    int32 x = 2;
    int32 y = 3;
    int32 width = 4;
    int32 height = 5;
    SetWindowPosFlags flags = 6;
}

enum SetWindowPosFlags {
    SET_WINDOW_POS_FLAGS_UNSPECIFIED = 0;
    SET_WINDOW_POS_FLAG_NOSIZE = 1;
    SET_WINDOW_POS_FLAG_NOMOVE = 2;
    SET_WINDOW_POS_FLAG_NOZORDER = 4;
    SET_WINDOW_POS_FLAG_NOREDRAW = 8;
    SET_WINDOW_POS_FLAG_NOACTIVATE = 16;
    SET_WINDOW_POS_FLAG_FRAMECHANGED = 32;
    SET_WINDOW_POS_FLAG_SHOWWINDOW = 64;
    SET_WINDOW_POS_FLAG_HIDEWINDOW = 128;
    SET_WINDOW_POS_FLAG_NOCOPYBITS = 256;
    SET_WINDOW_POS_FLAG_NOOWNERZORDER = 512;
    SET_WINDOW_POS_FLAG_NOSENDCHANGING = 1024;
    SET_WINDOW_POS_FLAG_DEFERERASE = 2048;
    SET_WINDOW_POS_FLAG_ASYNCWINDOWPOS = 4096;
}

// Screenshot
message CaptureWindowRequest {
    uint64 handle = 1;
    ImageFormat format = 2;
    int32 quality = 3;
    bool include_nonclient = 4;
}

message CaptureClientAreaRequest {
    uint64 handle = 1;
    ImageFormat format = 2;
    int32 quality = 3;
}

message CaptureRegionRequest {
    WindowRect region = 1;
    ImageFormat format = 2;
    int32 quality = 3;
}

// Window properties
message GetWindowTitleRequest {
    uint64 handle = 1;
}

message WindowTitleResponse {
    bool success = 1;
    string title = 2;
    string error = 3;
}

message SetWindowTitleRequest {
    uint64 handle = 1;
    string title = 2;
}

message GetWindowClassRequest {
    uint64 handle = 1;
}

message WindowClassResponse {
    bool success = 1;
    string class_name = 2;
    string error = 3;
}

message GetWindowProcessIdRequest {
    uint64 handle = 1;
}

message WindowProcessIdResponse {
    bool success = 1;
    uint32 process_id = 2;
    uint32 thread_id = 3;
    string error = 4;
}

message GetWindowStylesRequest {
    uint64 handle = 1;
}

message GetWindowExStylesRequest {
    uint64 handle = 1;
}

message WindowStylesResponse {
    bool success = 1;
    WindowStyles styles = 2;
    WindowStyles ex_styles = 3;
    string error = 4;
}

message SetWindowStylesRequest {
    uint64 handle = 1;
    WindowStyles styles = 2;
}

message SetWindowExStylesRequest {
    uint64 handle = 1;
    WindowStyles ex_styles = 2;
}

// Z-order
message BringToTopRequest {
    uint64 handle = 1;
}

message SendToBottomRequest {
    uint64 handle = 1;
}

message SetWindowZOrderRequest {
    uint64 handle = 1;
    uint64 insert_after = 2; // HWND_TOP, HWND_BOTTOM, HWND_TOPMOST, HWND_NOTOPMOST, or handle
    bool is_handle = 3;
}

// Input
message SetFocusRequest {
    uint64 handle = 1;
}

message PostMessageRequest {
    uint64 handle = 1;
    uint32 msg = 2;
    uint64 wparam = 3;
    int64 lparam = 4;
}

message SendMessageRequest {
    uint64 handle = 1;
    uint32 msg = 2;
    uint64 wparam = 3;
    int64 lparam = 4;
}

message MessageResponse {
    bool success = 1;
    int64 result = 2;
    string error = 3;
}

// Multi-monitor
message MonitorList {
    repeated MonitorInfo monitors = 1;
}

message MonitorInfo {
    string name = 1;
    WindowRect rect = 2;
    WindowRect work_area = 3;
    bool is_primary = 4;
    float scale_factor = 5;
    uint32 dpi_x = 6;
    uint32 dpi_y = 7;
}

message GetWindowMonitorRequest {
    uint64 handle = 1;
}

message MonitorResponse {
    bool success = 1;
    MonitorInfo monitor = 2;
    string error = 3;
}

// Image format (shared)
enum ImageFormat {
    IMAGE_FORMAT_UNSPECIFIED = 0;
    IMAGE_FORMAT_BGR = 1;
    IMAGE_FORMAT_RGB = 2;
    IMAGE_FORMAT_RGBA = 3;
    IMAGE_FORMAT_GRAY = 4;
    IMAGE_FORMAT_JPEG = 5;
    IMAGE_FORMAT_PNG = 6;
}

    RESOURCE_TYPE_FONT = 5;
    RESOURCE_TYPE_SCRIPT = 6;
    RESOURCE_TYPE_TEXT_TRACK = 7;
    RESOURCE_TYPE_XHR = 8;
    RESOURCE_TYPE_FETCH = 9;

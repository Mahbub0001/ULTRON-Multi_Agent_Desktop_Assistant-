# Vision Service Configuration
# All paths should be absolute or relative to the vision service working directory

[service]
host = "0.0.0.0"
port = 50051
workers = 4
log_level = "info"

[capture]
default_fps = 30
default_monitor = 0
jpeg_quality = 85
use_hardware_acceleration = true
# Windows: "dxgi", "gdi", "dxcam"
# Linux: "x11", "wayland", "pipewire"
# macOS: "coregraphics"
backend = "auto"

[detection]
model_path = "models/yolov8n.onnx"
device = "tensorrt"  # cpu, cuda, tensorrt, coreml, directml
batch_size = 1
default_confidence = 0.5
default_iou = 0.45
input_width = 640
input_height = 640
use_tensorrt = true
tensorrt_cache_dir = "models/tensorrt_cache"
# Class names (COCO dataset by default)
class_names = [
    "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck",
    "boat", "traffic light", "fire hydrant", "stop sign", "parking meter", "bench",
    "bird", "cat", "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra",
    "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee",
    "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove",
    "skateboard", "surfboard", "tennis racket", "bottle", "wine glass", "cup",
    "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange",
    "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch",
    "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse",
    "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink",
    "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier",
    "toothbrush"
]

[ocr]
engine = "paddle"  # "paddle" or "tesseract"
languages = ["en"]
use_gpu = true
gpu_id = 0
cpu_threads = 4
enable_mkldnn = true

# PaddleOCR model directories (will auto-download if not present)
paddle_det_model_dir = "models/paddleocr/det"
paddle_rec_model_dir = "models/paddleocr/rec"
paddle_cls_model_dir = "models/paddleocr/cls"

# Tesseract configuration
tesseract_data_path = ""
tesseract_config = "--oem 3 --psm 6"

[models]
# Directory for ONNX models
model_dir = "models"
# Auto-download models if missing
auto_download = true

[metrics]
enabled = true
port = 9090
path = "/metrics"

[logging]
format = "json"  # "json" or "console"
level = "info"
output = "stdout"
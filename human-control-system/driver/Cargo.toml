# Kernel Input Driver
# Cross-platform low-level input injection
# Windows: Interception driver | Linux: uinput

[package]
name = "hcs-driver"
version = "0.1.0"
edition = "2021"
description = "Human Control System - Kernel Input Driver"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourorg/human-control-system"
categories = ["os", "hardware-support", "embedded"]
keywords = ["input", "driver", "interception", "uinput", "automation"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["full", "tracing"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }

# Platform specific
windows = { workspace = true, optional = true }
nix = { workspace = true, optional = true }

# Driver communication
socket2 = "0.5"
mio = { version = "0.8", features = ["os-poll"] }

[features]
default = []
windows_driver = ["windows"]
linux_driver = ["nix"]
test_utils = ["tempfile"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[build-dependencies]
cc = "1.0"
bindgen = "0.69"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = true
overflow-checks = true